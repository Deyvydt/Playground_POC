[pytest]
# Cada componente se ejecuta en su propio proceso (los tres usan un paquete "app"):
# usar scripts/run-tests.py o "pytest tests/<componente>", nunca "pytest tests".
pythonpath = .
addopts = -p reporting_plugin -ra --strict-config
bdd_features_base_dir = ..
markers =
    funcional: prueba funcional (escenario de aceptación de un .feature)
    tecnica: prueba técnica (unitaria, API o contrato)
    particion: técnica de diseño - partición de equivalencias
    limites: técnica de diseño - análisis de valores límite
    tabla_decision: técnica de diseño - tabla de decisión (combinaciones de condiciones)
    transicion_estados: técnica de diseño - transición de estados
    propiedades: técnica de diseño - pruebas basadas en propiedades / fuzzing
    ejemplos: técnica de diseño - especificación por ejemplos (BDD)
    adivinanza_errores: técnica de diseño - adivinanza de errores (entradas raras conocidas)
    regresion: prueba de regresión de un defecto corregido
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # Advertencia interna de LangGraph/LangChain, ajena al código del proyecto.
    ignore:The default value of .allowed_objects.:Warning
